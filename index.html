<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบลงเวลาคนขับรถส่งของ</title>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Sukhumvit Set', -apple-system, BlinkMacSystemFont, sans-serif; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 24px;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h3 { color: #38bdf8; margin-top: 0; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 16px; }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0f172a;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid #334155;
      text-align: left;
    }
    .profile-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #38bdf8;
      object-fit: cover;
      background: #334155;
    }
    input {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }
    input:focus { border-color: #38bdf8; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      display: block;
      box-sizing: border-box;
    }
    .btn-cam {
      background: #0284c7 !important;
      margin-top: 12px;
    }
    button:disabled { background: #334155 !important; color: #64748b !important; cursor: not-allowed; }
    .camera-container {
      width: 100%;
      margin-top: 12px;
      border-radius: 12px;
      background: #000;
      min-height: 240px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 2px solid #334155;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #capturedPhoto {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      transform: scaleX(-1);
    }
    .status-msg {
      margin-top: 14px;
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .badge {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: left;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .notice-box {
      background: #1e1b4b;
      border: 1px solid #4338ca;
      color: #c7d2fe;
      padding: 18px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="loadingSec">
      <h3>🚚 ระบบขนส่งพัสดุ</h3>
      <p id="initStatusText">กำลังเชื่อมต่อ LINE ID...</p>
    </div>

    <!-- ส่วนลงทะเบียน -->
    <div id="regSec" style="display: none;">
      <div class="profile-header">
        <img id="regLinePic" class="profile-img" src="" alt="Profile">
        <div>
          <b id="regLineName" style="color: #38bdf8; font-size: 15px;">-</b><br>
          <span style="font-size: 12px; color: #94a3b8;">เชื่อมต่อบัญชี LINE สำเร็จ</span>
        </div>
      </div>

      <h3>🚚 ลงทะเบียนคนขับรถ</h3>
      <p>กรอกข้อมูลเพื่อขออนุมัติใช้งานระบบ</p>
      
      <input type="text" id="regEmpId" placeholder="รหัสพนักงาน / รหัสคนขับ" required>
      <input type="text" id="regEmpName" placeholder="ชื่อ - นามสกุล" required>
      <input type="text" id="regDept" placeholder="สายส่ง / ทะเบียนรถ" required>

      <button type="button" id="btnRegSubmit" onclick="doRegister()">บันทึกข้อมูลลงทะเบียน</button>
      <div id="regStatus" class="status-msg"></div>
    </div>

    <!-- ส่วนแจ้งเตือน -->
    <div id="noticeSec" style="display: none;">
      <h3 id="noticeTitle">แจ้งเตือน</h3>
      <div class="notice-box" id="noticeBody"></div>
    </div>

    <!-- ส่วนลงเวลาทำงาน (ถึงจุดหมายอัตโนมัติ) -->
    <div id="checkSec" style="display: none;">
      <div class="profile-header">
        <img id="checkLinePic" class="profile-img" src="" alt="Profile">
        <div>
          <b id="checkLineName" style="color: #38bdf8; font-size: 15px;">-</b><br>
          <span id="checkDept" style="font-size: 12px; color: #94a3b8;">สายส่ง: -</span>
        </div>
      </div>

      <h3>🏁 เช็กอินถึงจุดหมาย</h3>
      <div class="badge" id="empBadge"></div>

      <!-- สตรีมกล้องหน้าสด -->
      <div class="camera-container">
        <video id="videoFeed" autoplay playsinline muted></video>
        <img id="capturedPhoto" alt="ภาพถ่ายยืนยัน">
        <canvas id="captureCanvas" style="display:none;"></canvas>
      </div>

      <button type="button" id="btnSnap" class="btn-cam" onclick="takeSnapshot()">📸 กดถ่ายรูปยืนยันตัวตน (กล้องหน้า)</button>
      <button type="button" id="btnRetake" class="btn-cam" style="display:none; background:#475569 !important;" onclick="retakePhoto()">🔄 ถ่ายรูปใหม่</button>

      <!-- กล่องแสดงสถานะ GPS และสาขาที่ตรวจพบอัตโนมัติ -->
      <div id="checkStatus" class="status-msg">⏳ กำลังค้นหาสาขาปลายทางจากพิกัด GPS...</div>

      <button type="button" id="btnCheckSubmit" onclick="doAttendance()" disabled>ยืนยันถึงจุดหมาย</button>
    </div>
  </div>

  <script>
    const LIFF_ID = "2011720736-FTzsT0tU";
    const API_URL = "https://script.google.com/macros/s/AKfycbwF8JEzOZ07a_t69Fqx5vT9TrKb3cuWSFL0r8Lxf2Dol6J0V1D64irB9D0uFR2u2lCdMA/exec";

    // ฐานข้อมูลพิกัด 16 สาขา + Head Office
    const BRANCHES = [
      { name: "DC020 - สาขาเชียงราย", lat: 19.805456, lng: 99.750431 },
      { name: "DC019 - สาขานครปฐม", lat: 14.023389, lng: 100.258996 },
      { name: "DC017 - สาขาสมุทรปราการ", lat: 13.647659, lng: 100.542728 },
      { name: "DC016 - สาขาเชียงใหม่", lat: 18.745124, lng: 99.012827 },
      { name: "DC014 - สาขาสงขลา", lat: 7.091895, lng: 100.578084 },
      { name: "DC013 - สาขาสุราษฎร์ธานี", lat: 9.107207, lng: 99.16104 },
      { name: "DC011 - สาขาพัทยา", lat: 12.863535, lng: 100.906346 },
      { name: "DC010 - สาขาสุรินทร์", lat: 14.971223, lng: 103.524846 },
      { name: "DC009 - สาขาเพชรบูรณ์", lat: 16.74352, lng: 101.196398 },
      { name: "DC008 - สาขานครศรีธรรมราช", lat: 8.331915, lng: 99.884532 },
      { name: "DC007 - สาขาอุดรธานี", lat: 17.306272, lng: 102.849829 },
      { name: "DC006 - สาขานครสวรรค์", lat: 15.639752, lng: 100.133297 },
      { name: "DC005 - สาขาอุบลราชธานี", lat: 15.181401, lng: 104.913779 },
      { name: "DC004 - สาขาร้อยเอ็ด", lat: 15.979452, lng: 103.626549 },
      { name: "DC003 - สาขานครราชสีมา", lat: 15.062243, lng: 102.193027 },
      { name: "DC001 - สาขาขอนแก่น", lat: 16.489782, lng: 102.780493 },
      { name: "Head Office (HQ)", lat: 13.900023, lng: 101.544922 }
    ];

    let profile = null;
    let currentUser = null;
    let curLat = null;
    let curLng = null;
    let curPhoto = null;
    let nearestBranch = null;
    let curDistance = null;
    let videoStream = null;

    window.onload = function() {
      startFastGPS();

      if (typeof liff !== "undefined") {
        liff.init({ liffId: LIFF_ID })
          .then(() => {
            if (!liff.isLoggedIn()) {
              liff.login();
            } else {
              liff.getProfile().then(p => {
                profile = p;
                checkUser();
              }).catch(err => alert("ดึงโปรไฟล์ LINE ไม่สำเร็จ: " + err.message));
            }
          })
          .catch(err => alert("LIFF Error: " + err.message));
      }
    };

    function calcDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      return Math.round(R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))));
    }

    // คำนวณหาสาขาที่ใกล้ที่สุดอัตโนมัติ
    function autoDetectNearestBranch() {
      if (!curLat || !curLng) return;

      let minDistance = Infinity;
      let closest = null;

      BRANCHES.forEach(b => {
        const d = calcDistanceMeters(curLat, curLng, b.lat, b.lng);
        if (d < minDistance) {
          minDistance = d;
          closest = b;
        }
      });

      nearestBranch = closest;
      curDistance = minDistance;

      const statusEl = document.getElementById('checkStatus');
      const submitBtn = document.getElementById('btnCheckSubmit');

      if (curDistance <= 500) {
        statusEl.innerHTML = `📍 จุดหมายปลายทาง: <b>${nearestBranch.name}</b><br>📏 ระยะห่าง: <b>${curDistance} เมตร</b><br><span style="color:#4ade80; font-weight:600;">✅ อยู่ในพื้นที่กำหนด (ไม่เกิน 500 ม.)</span>`;
        if (curPhoto) submitBtn.disabled = false;
        else submitBtn.disabled = true;
      } else {
        statusEl.innerHTML = `📍 สาขาที่ใกล้ที่สุด: <b>${nearestBranch.name}</b><br>📏 ระยะห่าง: <b>${curDistance.toLocaleString()} เมตร</b><br><span style="color:#f87171; font-weight:600;">❌ อยู่นอกพื้นที่เช็กอิน (ต้องไม่เกิน 500 ม.)</span>`;
        submitBtn.disabled = true;
      }
    }

    function startFastGPS() {
      if (!navigator.geolocation) {
        document.getElementById('checkStatus').innerText = "⚠️ อุปกรณ์ไม่รองรับ GPS";
        return;
      }

      const geoOptions = { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 };

      navigator.geolocation.getCurrentPosition(
        pos => {
          curLat = pos.coords.latitude;
          curLng = pos.coords.longitude;
          autoDetectNearestBranch();
        },
        err => {
          document.getElementById('checkStatus').innerText = "⚠️ กรุณาเปิด Location Service";
          document.getElementById('checkStatus').style.color = "#f87171";
        },
        geoOptions
      );

      navigator.geolocation.watchPosition(pos => {
        curLat = pos.coords.latitude;
        curLng = pos.coords.longitude;
        autoDetectNearestBranch();
      }, null, geoOptions);
    }

    function startLiveCamera() {
      const video = document.getElementById('videoFeed');
      const constraints = {
        video: { facingMode: "user", width: { ideal: 480 }, height: { ideal: 480 } },
        audio: false
      };

      navigator.mediaDevices.getUserMedia(constraints)
        .then(stream => {
          videoStream = stream;
          video.srcObject = stream;
        })
        .catch(err => {
          navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(stream => {
              videoStream = stream;
              video.srcObject = stream;
            })
            .catch(e => alert("กรุณาอนุญาตให้เว็บเข้าถึงกล้องหน้า: " + e.message));
        });
    }

    function takeSnapshot() {
      const video = document.getElementById('videoFeed');
      const canvas = document.getElementById('captureCanvas');
      const photo = document.getElementById('capturedPhoto');

      if (!video.videoWidth) {
        alert("กล้องยังไม่พร้อมใช้งาน กรุณารอสักครู่");
        return;
      }

      const scale = 480 / video.videoWidth;
      canvas.width = 480;
      canvas.height = Math.round(video.videoHeight * scale);

      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      curPhoto = canvas.toDataURL('image/jpeg', 0.6);
      photo.src = curPhoto;
      photo.style.display = 'block';
      video.style.display = 'none';

      document.getElementById('btnSnap').style.display = 'none';
      document.getElementById('btnRetake').style.display = 'block';

      if (curDistance !== null && curDistance <= 500) {
        document.getElementById('btnCheckSubmit').disabled = false;
      }
    }

    function retakePhoto() {
      curPhoto = null;
      document.getElementById('capturedPhoto').style.display = 'none';
      document.getElementById('videoFeed').style.display = 'block';
      document.getElementById('btnSnap').style.display = 'block';
      document.getElementById('btnRetake').style.display = 'none';
      document.getElementById('btnCheckSubmit').disabled = true;
    }

    function checkUser() {
      fetch(`${API_URL}?action=checkUser&uid=${encodeURIComponent(profile.userId)}`, {
        method: "GET",
        mode: "cors",
        redirect: "follow"
      })
      .then(res => res.json())
      .then(res => {
        document.getElementById('loadingSec').style.display = 'none';

        if (res.exists) {
          currentUser = res;
          if (res.status === "อนุมัติ") {
            document.getElementById('checkLinePic').src = profile.pictureUrl || "https://placehold.co/48x48?text=LINE";
            document.getElementById('checkLineName').innerText = profile.displayName;
            document.getElementById('checkDept').innerText = "สายส่ง: " + res.dept;
            document.getElementById('empBadge').innerHTML = `
              👤 <b>พนักงาน:</b> ${res.empName} (รหัส: ${res.empId})
            `;
            document.getElementById('checkSec').style.display = 'block';
            startLiveCamera();
            autoDetectNearestBranch();
          } else if (res.status === "รออนุมัติ") {
            showNotice("รอการอนุมัติ", `คุณ <b>${res.empName}</b> ได้ลงทะเบียนไว้แล้ว<br><br>กรุณารอแอดมินกดยืนยันอนุมัติในระบบ`);
          } else {
            showNotice("แจ้งเตือน", `สถานะบัญชี: ${res.status}`);
          }
        } else {
          document.getElementById('regLinePic').src = profile.pictureUrl || "https://placehold.co/48x48?text=LINE";
          document.getElementById('regLineName').innerText = profile.displayName;
          document.getElementById('regSec').style.display = 'block';
        }
      })
      .catch(err => {
        document.getElementById('loadingSec').style.display = 'none';
        alert("เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ: " + err.message);
      });
    }

    function showNotice(title, html) {
      document.getElementById('noticeTitle').innerText = title;
      document.getElementById('noticeBody').innerHTML = html;
      document.getElementById('noticeSec').style.display = 'block';
    }

    function doRegister() {
      const id = document.getElementById('regEmpId').value.trim();
      const name = document.getElementById('regEmpName').value.trim();
      const dept = document.getElementById('regDept').value.trim();
      if (!id || !name || !dept) return alert("กรุณากรอกข้อมูลให้ครบถ้วน");

      const btn = document.getElementById('btnRegSubmit');
      btn.disabled = true;
      document.getElementById('regStatus').innerText = "⏳ กำลังส่งข้อมูลลงทะเบียน...";

      fetch(API_URL, {
        method: "POST",
        mode: "cors",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "register",
          lineUserId: profile.userId,
          empId: id,
          empName: name,
          dept: dept,
          pictureUrl: profile.pictureUrl || ""
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          document.getElementById('regSec').style.display = 'none';
          showNotice("ลงทะเบียนสำเร็จ", "ส่งข้อมูลเรียบร้อยแล้ว แจ้งแอดมินให้อนุมัติสิทธิ์ได้เลยครับ");
        } else {
          alert(res.error || "บันทึกไม่สำเร็จ");
          btn.disabled = false;
        }
      })
      .catch(err => {
        alert("ส่งข้อมูลไม่สำเร็จ: " + err.message);
        btn.disabled = false;
      });
    }

    function doAttendance() {
      if (!nearestBranch) return alert("ยังไม่สามารถระบุพิกัดสาขาได้");
      if (!curPhoto) return alert("กรุณากดถ่ายรูปยืนยันตัวตนก่อน");
      if (curDistance > 500) return alert("อยู่นอกพื้นที่ ไม่สามารถบันทึกได้");

      const empName = currentUser ? currentUser.empName : profile.displayName;
      const empId = currentUser ? currentUser.empId : "-";

      const btn = document.getElementById('btnCheckSubmit');
      btn.disabled = true;
      document.getElementById('checkStatus').innerText = "⏳ กำลังบันทึกข้อมูลและอัปโหลดรูป...";

      const now = new Date();
      const dateStr = now.toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      fetch(API_URL, {
        method: "POST",
        mode: "cors",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "recordAttendance",
          lineUserId: profile.userId,
          locationName: nearestBranch.name,
          distance: curDistance,
          lat: curLat,
          lng: curLng,
          image: curPhoto
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          const msgText = `✅ บันทึกเช็กอินถึงจุดหมายสำเร็จ\n` +
                          `──────────────────\n` +
                          `👤 พนักงาน: ${empName} (รหัส: ${empId})\n` +
                          `🏁 ปลายทาง: ${nearestBranch.name}\n` +
                          `📅 วันที่: ${dateStr}\n` +
                          `⏰ เวลา: ${timeStr} น.\n` +
                          `📏 ระยะห่าง: ${curDistance} เมตร\n` +
                          `📍 พิกัด: ${curLat.toFixed(5)}, ${curLng.toFixed(5)}\n` +
                          `──────────────────\n` +
                          `สถานะ: บันทึกข้อมูลเรียบร้อยแล้ว`;

          if (liff.isInClient()) {
            liff.sendMessages([{
              type: 'text',
              text: msgText
            }]).then(() => {
              alert(`เช็กอินสำเร็จ: ${empName}\nสาขา: ${nearestBranch.name} (${curDistance} ม.)`);
              if (videoStream) videoStream.getTracks().forEach(track => track.stop());
              liff.closeWindow();
            }).catch(err => {
              alert(`เช็กอินสำเร็จ: ${empName}\nสาขา: ${nearestBranch.name} (${curDistance} ม.)`);
              if (videoStream) videoStream.getTracks().forEach(track => track.stop());
              liff.closeWindow();
            });
          } else {
            alert(`เช็กอินสำเร็จ: ${empName}\nสาขา: ${nearestBranch.name} (${curDistance} ม.)`);
            liff.closeWindow();
          }
        } else {
          alert("ไม่สำเร็จ: " + (res.error || res.message));
          btn.disabled = false;
        }
      })
      .catch(err => {
        alert("เชื่อมต่อไม่สำเร็จ: " + err.message);
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
